# Problem 1: Ek step likho jo DockerHub par login kare aur unique commit ID ${{ github.sha }} ka use karke image build aur push kare.

name: Build Test and Deploy

on: 
  push:
    branches: ["main"]
    paths:
      - 'apps/**'
  pull_request:
    branches: ["problem-1"]
    paths:
      - 'apps/**'
  
  
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-jobs:
    runs-on: ubuntu-latest

    steps: 
      - name : Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Docker Login 
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }} 
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Docker Push 
        run: |
          SERVICE_NAME=$(git diff --name-only HEAD~1 HEAD | grep 'apps/' | head -n 1 | cut -d '/' -f 2)
          echo "Asli Dynamic Service Jo Badli Hai: $SERVICE_NAME"
          docker build -f apps/$SERVICE_NAME/Dockerfile -t rishav/$SERVICE_NAME:${{ github.sha }} apps/$SERVICE_NAME/
          docker push rishav/$SERVICE_NAME:${{ github.sha }} 

