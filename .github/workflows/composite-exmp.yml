name: CI/CD Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- COMPOSITE ACTION CALL ---
      - name: Setup Environment and Install
        uses: ./.github/actions/setup-node-npm
        with:
          working-directory: './frontend' 
          node-version: '20'

      - name: Run Build
        working-directory: ./frontend
        run: npm run build

      # --- ARTIFACT REUSE LOGIC ---
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: frontend/dist/
          retention-days: 1

  test:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: frontend/dist/

      - name: Run Sanity Check
        working-directory: ./frontend
        run: |
          ls -R dist/
          echo "Build is verified and ready!"