name: Professional Scalable CI

on:
  push:
    branches: ["feat/auth"]
    paths-ignore:
      - '**.md'
      - '.gitignore'

permissions:
  id-token: write
  contents: read

env:
  PROJECT_ID: project-5e783ec5-d363-4cc7-884
  GAR_LOCATION: us-central1
  REPO_NAME: social-app-repo

jobs:
  # 🔍 STEP 1: Change Detection (Single Job for all)
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      # Isko JSON format me pass karenge matrix ke liye
      services: ${{ steps.filter.outputs.changes }}
      common: ${{ steps.filter.outputs.common }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.before }}
          filters: |
            identity-service: 'apps/identity-service/**'
            post-service: 'apps/post-service/**'
            common: 'packages/common/**'

  # 🚀 STEP 2: Universal Build Job (Matrix + Selective)
  build:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.services != '[]' || needs.detect-changes.outputs.common == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.common == 'true' && '["identity-service", "post-service"]' || needs.detect-changes.outputs.services) }}
    
    steps:
      - uses: actions/checkout@v4

      - name: 'Authenticate to GCP'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/2893262057/locations/global/workloadIdentityPools/social-app-pool/providers/social-app-provider'
          service_account: 'github-oidc-sa@project-5e783ec5-d363-4cc7-884.iam.gserviceaccount.com'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: 'Docker Auth'
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

      - name: Build and Push
        run: |
          IMAGE_NAME="${{ matrix.service }}"
          docker build -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/$IMAGE_NAME:${{ github.sha }} -f apps/$IMAGE_NAME/Dockerfile .
          docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/$IMAGE_NAME:${{ github.sha }}