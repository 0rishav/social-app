name: Professional Scalable CI

on:
  push:
    branches: ["feat/auth"]
    paths-ignore:
      - '**.md'
      - '.gitignore'

permissions:
  id-token: write
  contents: write # Git push ke liye permission

env:
  PROJECT_ID: project-5e783ec5-d363-4cc7-884
  GAR_LOCATION: us-central1
  REPO_NAME: social-app-repo

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
      common: ${{ steps.filter.outputs.common }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            identity-service: 'apps/identity-service/**'
            post-service: 'apps/post-service/**'
            common: 'packages/common/**'

  build:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.services != '[]' || needs.detect-changes.outputs.common == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.common == 'true' && '["identity-service", "post-service"]' || needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/2893262057/locations/global/workloadIdentityPools/social-app-pool/providers/social-app-provider'
          service_account: 'github-oidc-sa@project-5e783ec5-d363-4cc7-884.iam.gserviceaccount.com'
      - name: 'Docker Auth'
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev
      
      - name: Build and Push
        run: |
          FULL_IMAGE_NAME="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ matrix.service }}"
          docker build -t $FULL_IMAGE_NAME:${{ github.sha }} -f apps/${{ matrix.service }}/Dockerfile .
          docker push $FULL_IMAGE_NAME:${{ github.sha }}

  # 🚀 Naya Job: Saare manifests ek saath update karne ke liye
  update-manifests:
    needs: [detect-changes, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for pushing back

      - name: Update Kustomize Tags
        run: |
          cd k8s-manifest
          SERVICES='${{ needs.detect-changes.outputs.services }}'
          COMMON='${{ needs.detect-changes.outputs.common }}'
          
          # Agar common package change hua hai toh sab update karo, warna sirf changed services
          if [ "$COMMON" == "true" ]; then
            ALL_SERVICES=("identity-service" "post-service")
          else
            # JSON string ko bash array me convert karna
            ALL_SERVICES=$(echo $SERVICES | jq -r '.[]')
          fi

          for SERVICE in ${ALL_SERVICES[@]}; do
            ORIGINAL_IMAGE="raunakraj010/$SERVICE"
            NEW_IMAGE_PATH="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/$SERVICE"
            kustomize edit set image $ORIGINAL_IMAGE=$NEW_IMAGE_PATH:${{ github.sha }}
          done

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s-manifest/kustomization.yaml
          git commit -m "chore: update multiple service images to ${{ github.sha }} [skip ci]" || echo "No changes"
          git push origin feat/auth